services:
  neo4j:
    image: neo4j:5.11-community
    container_name: crimevision-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in root .env}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  research-engine:
    build:
      context: ./research-engine
      dockerfile: Dockerfile
    container_name: crimevision-research-engine
    restart: unless-stopped
    ports:
      # Loopback-only on the host. The container binds 0.0.0.0 internally,
      # which is why ALLOW_NON_LOOPBACK=1 is set below. Do not change the
      # host side to 0.0.0.0:8001:8001 unless you put an authenticated proxy
      # in front of it.
      - "127.0.0.1:8001:8001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in root .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DEFAULT_DEVICE: ${DEFAULT_DEVICE:-auto}
      CLIP_MODEL_NAME: ${CLIP_MODEL_NAME:-openai/clip-vit-base-patch32}
      CLIP_MODEL_REVISION: ${CLIP_MODEL_REVISION:-}
      TRUST_MODE: ${TRUST_MODE:-heterogeneity}
      OT_TRUST_TAU: ${OT_TRUST_TAU:-50.0}
      OT_TRUST_K: ${OT_TRUST_K:-100.0}
      # Decision mechanism (mutually exclusive). Leave all three empty for
      # INDETERMINATE-only mode.
      EVIDENTIAL_HEAD_PATH: ${EVIDENTIAL_HEAD_PATH:-}
      EVIDENTIAL_CALIBRATION_PATH: ${EVIDENTIAL_CALIBRATION_PATH:-}
      CONFORMAL_ARTIFACT_PATH: ${CONFORMAL_ARTIFACT_PATH:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      MAX_STATEMENT_BYTES: ${MAX_STATEMENT_BYTES:-65536}
      MAX_STATEMENT_CHARS: ${MAX_STATEMENT_CHARS:-20000}
      MAX_VIDEO_DURATION_SECONDS: ${MAX_VIDEO_DURATION_SECONDS:-300}
      MAX_VIDEO_FRAME_COUNT: ${MAX_VIDEO_FRAME_COUNT:-200000}
      MAX_CONCURRENT_ANALYSIS: ${MAX_CONCURRENT_ANALYSIS:-2}
      ALLOW_NON_LOOPBACK: "1"
      RESEARCH_API_HOST: 0.0.0.0
      EVIDENCE_STORAGE_ROOT: /data/evidence
      MEMORY_SNAPSHOT_PATH: /data/memory_snapshot.json
    volumes:
      - research_evidence:/data/evidence
      - research_models:/models
      - research_snapshot:/data
      - ./research-engine/models:/app/models:ro
    depends_on:
      neo4j:
        condition: service_healthy

  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://127.0.0.1:8001}
    container_name: crimevision-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_RESEARCH_API_URL: ${NEXT_PUBLIC_RESEARCH_API_URL:-http://127.0.0.1:8001}
    depends_on:
      - research-engine

volumes:
  neo4j_data:
  research_evidence:
  research_models:
  research_snapshot:
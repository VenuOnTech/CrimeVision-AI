version: '3.8'

services:
  # MongoDB Document Database
  mongodb:
    image: mongo:6.0
    container_name: crimevision-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: crimevision
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Neo4j Knowledge Graph Database
  neo4j:
    image: neo4j:5.11-community
    container_name: crimevision-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/crimevision_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Web Interface
      - "7687:7687" # Bolt Protocol Port
    volumes:
      - neo4j_data:/data

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimevision-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://admin:secretpassword@mongodb:27017/crimevision?authSource=admin
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crimevision_password
    depends_on:
      - mongodb
      - neo4j

  # React / Next.js Web Dashboard
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: crimevision-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mongo_data:
  neo4j_data:
name: CrimeVision CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  research-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research-engine/requirements.in
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.24,<3" \
            "torch>=2,<3" \
            "opencv-python-headless>=4.8,<6" \
            "pillow>=9.5,<12" \
            "fastapi>=0.100,<1" \
            "pydantic>=2,<3" \
            "python-multipart>=0.0.6,<1" \
            "python-dotenv>=1,<2" \
            "httpx>=0.24,<1" \
            "pytest>=7.4,<10"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run research-engine tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_RESEARCH_API_URL: http://127.0.0.1:8001
